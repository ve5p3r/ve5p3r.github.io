name: Verify and publish site image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ve5p3r/ve5p3r.github.io

jobs:
  verify:
    name: Check, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run project checks
        run: bun run check:local

      - name: Run application regression tests
        run: bun run test

      - name: Build runtime image
        run: docker build --pull --tag public-site-ci:${{ github.sha }} .

      - name: Start runtime image
        run: |
          docker run --detach --name public-site-smoke \
            --publish 127.0.0.1::5173 public-site-ci:${{ github.sha }}
          echo "SMOKE_PORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5173/tcp") 0).HostPort}}' public-site-smoke)" >> "$GITHUB_ENV"

      - name: Check health and public-route privacy
        run: |
          set -euo pipefail
          base="http://127.0.0.1:$SMOKE_PORT"
          for attempt in {1..30}; do
            if curl --retry 5 --retry-delay 1 --retry-all-errors --fail --silent --show-error "$base/healthz" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs public-site-smoke
              exit 1
            fi
            sleep 1
          done
          curl --retry 5 --retry-delay 1 --retry-all-errors --fail --silent --show-error "$base/" | grep -qi '<html'
          for path in '/.env' '/package.json' '/README.md' '/src/server.ts' '/src/server.tsx'; do
            status="$(curl --retry 5 --retry-delay 1 --retry-all-errors --silent --output /dev/null --write-out '%{http_code}' "$base$path")"
            test "$status" = 404
          done

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force public-site-smoke >/dev/null 2>&1 || true

  publish:
    name: Publish immutable GHCR image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-pages
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          provenance: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Smoke-test the published digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          reference="$IMAGE_NAME@$IMAGE_DIGEST"
          docker pull "$reference"
          image_user="$(docker inspect --format '{{.Config.User}}' "$reference")"
          test -n "$image_user"
          test "$image_user" != root
          test "$image_user" != 0
          docker run --detach --name published-site-smoke \
            --publish 127.0.0.1::5173 "$reference"
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5173/tcp") 0).HostPort}}' published-site-smoke)"
          base="http://127.0.0.1:$port"
          for attempt in {1..30}; do
            if curl --retry 5 --retry-delay 1 --retry-all-errors --fail --silent --show-error "$base/healthz" >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs published-site-smoke; exit 1; fi
            sleep 1
          done
          curl --retry 5 --retry-delay 1 --retry-all-errors --fail --silent --show-error "$base/" | grep -qi '<html'
          for path in '/.env' '/package.json' '/README.md' '/src/server.ts' '/src/server.tsx'; do
            test "$(curl --retry 5 --retry-delay 1 --retry-all-errors --silent --output /dev/null --write-out '%{http_code}' "$base$path")" = 404
          done

      - name: Stop published-image smoke test
        if: always()
        run: docker rm --force published-site-smoke >/dev/null 2>&1 || true


      - name: Create release metadata
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir release
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg tag "sha-$GITHUB_SHA" \
            --arg generated_at "$(date --utc --iso-8601=seconds)" \
            '{
              schema_version: 1,
              repository: $repository,
              workflow_run_id: $workflow_run_id,
              commit: $commit,
              branch: $branch,
              image: $image,
              digest: $digest,
              tag: $tag,
              generated_at: $generated_at
            }' > release/release.json

      - name: Upload deployment release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site-release
          path: release/release.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  deploy-azure:
    name: Deploy published digest to Azure App Service
    # Failover host for the same image hera runs. Uses OIDC (no stored Azure password):
    # a user-assigned managed identity whose federated credential trusts only
    # repo:<this repo>:environment:github-pages, with Website Contributor on this one web app.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: azure-deploy-ve5p3r-dev-site
      cancel-in-progress: false
    env:
      AZURE_WEBAPP: ve5p3r-dev-site
      AZURE_RESOURCE_GROUP: rg-sites
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the web app at the immutable digest
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP" \
            --container-image-name "$IMAGE_NAME@$IMAGE_DIGEST" --output none

      - name: Wait for the new container to report healthy
        run: |
          set -euo pipefail
          host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP" --query defaultHostName --output tsv)"
          configured="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP" --query linuxFxVersion --output tsv)"
          echo "Configured: $configured"
          case "$configured" in *"$IMAGE_DIGEST"*) ;; *) echo "digest not applied"; exit 1;; esac
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 20 "https://$host/healthz" >/dev/null && \
               curl --fail --silent --show-error --max-time 20 "https://$host/" | grep -qi '<html'; then
              echo "Healthy on https://$host"; exit 0
            fi
            sleep 15
          done
          echo "Azure app did not become healthy"; exit 1
